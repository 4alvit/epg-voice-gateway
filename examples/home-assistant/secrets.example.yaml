# Merge these keys into the existing private Home Assistant secrets.yaml.
# Use a gateway URL reachable from Home Assistant, not an assumed cluster DNS name.
epg_voice_gateway_play_url: https://voice.example.com/v1/play
epg_voice_gateway_catalogue_url: https://voice.example.com/v1/catalogue
epg_voice_gateway_authorization: Bearer REPLACE_WITH_EPG_API_TOKEN
epg_voice_player_entity: media_player.example_display
epg_voice_news_channel_id: REPLACE_WITH_VERIFIED_CATALOGUE_CHANNEL_ID
# Optional automatic Google sync: the HA user ID used for Google account linking.
# Leave empty and keep automatic sync disabled until HomeGraph is configured.
epg_voice_google_agent_user_id: ""
