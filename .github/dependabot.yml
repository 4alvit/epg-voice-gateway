version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /container
    schedule:
      interval: daily
