name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python_checks:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    if: >-
      (github.event.repository.private != true ||
       github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    # Private installations retain their trusted runner. Public PRs use hosted VMs.
    runs-on: ${{ fromJSON(github.event.repository.private == true && '["self-hosted","Linux","X64","epg-voice-gateway"]' || '["ubuntu-latest"]') }}
    # Bounded private runners need time for cold dependencies and checkout cleanup.
    timeout-minutes: ${{ github.event.repository.private == true && 30 || 20 }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
          python-version: ${{ matrix.python }}
          enable-cache: false
          cache-local-path: ${{ runner.temp }}/epg-voice-uv-cache
      - run: uv sync --locked --extra test
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff check src integrations --select S
      - run: uv run --frozen pytest -q
      - name: Verify runtime export without dependency resolution
        run: |
          uv export --locked --offline --no-dev --no-emit-project -o "$RUNNER_TEMP/requirements.lock" >/dev/null
      - name: Clean local dependency cache
        if: ${{ always() }}
        run: rm -rf -- "$RUNNER_TEMP/epg-voice-uv-cache"
  node_checks:
    if: >-
      (github.event.repository.private != true ||
       github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    # Private installations retain their trusted runner. Public PRs use hosted VMs.
    runs-on: ${{ fromJSON(github.event.repository.private == true && '["self-hosted","Linux","X64","epg-voice-gateway"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: node --test deploy/google-home-worker-vpc/relay.test.mjs
      - run: node --test deploy/alexa-worker-vpc/relay.test.mjs
  container:
    if: github.event.repository.private != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the actual installed image
        run: docker build --progress=plain --tag epg-voice-gateway:ci .
      - name: Verify installed startup and authentication without network access
        run: docker run --rm --network none --interactive --entrypoint python epg-voice-gateway:ci - < container/smoke.py
      - name: Scan the actual image and retain its complete package inventory
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: epg-voice-gateway:ci
          format: json
          output: container-trivy.json
          scanners: vuln
          list-all-pkgs: true
          ignore-unfixed: false
          exit-code: '0'
      - name: Verify the native library fix and export the SBOM
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("container-trivy.json").read_text())
          packages = [package for result in report["Results"] for package in result.get("Packages", [])]
          matches = [package for package in packages if package["Name"] == "liblzma5"]
          assert len(matches) == 1, "The scanner must identify the installed liblzma5"
          assert matches[0]["Version"] == "5.8.1"
          assert matches[0]["Release"] == "1+deb13u2"
          findings = {finding["VulnerabilityID"] for result in report["Results"] for finding in result.get("Vulnerabilities", [])}
          assert not findings.intersection({"DSA-6549-1", "TEMP-1147318-639065", "GHSA-5qpq-xqfv-j9pg"})
          print("Verified the exact patched liblzma5 package and absence of the XZ advisory; all other findings remain in the report.")
          PY
          trivy convert --format cyclonedx --output container-sbom.cdx.json container-trivy.json
      - name: Upload image inventory and vulnerability evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-security-evidence
          path: |
            container-trivy.json
            container-sbom.cdx.json
          if-no-files-found: error
          retention-days: 14

  worker_profile:
    if: github.event.repository.private != true
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the exact qualified shared profile
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: victron-venus/terraform-cloudflare-inverter-gateway
          ref: adc6d9f833bb4b42f3957bdedf5b6fed4ad21482
          path: .shared-cloudflare
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
          python-version: '3.12'
          enable-cache: false
      - run: uv sync --locked --extra test
      - name: Reproduce the independently qualified production bytes
        run: |
          uv run --frozen python scripts/worker_profile.py --shared-source .shared-cloudflare build --go "$(command -v go)" --output "$RUNNER_TEMP/qualified-provider"
          cp .shared-cloudflare/security/provider/NOTICE "$RUNNER_TEMP/qualified-provider/UPSTREAM-NOTICE"
          cp .shared-cloudflare/LICENSE "$RUNNER_TEMP/qualified-provider/SHARED-MIT-LICENSE"
      - name: Prepare the pinned FLOSS engine and shared mirror dependency
        run: |
          mkdir -p "$RUNNER_TEMP/worker-tools"
          curl --proto '=https' --proto-redir '=https' --fail --silent --show-error --location https://github.com/opentofu/opentofu/releases/download/v1.13.1/tofu_1.13.1_linux_amd64.zip -o "$RUNNER_TEMP/worker-tools/tofu.zip"
          printf '%s  %s\n' '8ccbc6f8ee21d2827715f3c6e08a9b3e0209b1e62057c05067ef117e047c1a80' "$RUNNER_TEMP/worker-tools/tofu.zip" | sha256sum --check --strict
          unzip "$RUNNER_TEMP/worker-tools/tofu.zip" -d "$RUNNER_TEMP/worker-tools"
          curl --proto '=https' --proto-redir '=https' --fail --silent --show-error --location https://releases.hashicorp.com/terraform-provider-local/2.9.1/terraform-provider-local_2.9.1_linux_amd64.zip -o "$RUNNER_TEMP/worker-tools/local.zip"
      - name: Verify actual Worker schemas, offline plans and shared runtime TLS
        run: |
          uv run --frozen python scripts/worker_profile.py --shared-source .shared-cloudflare check --provider-dir "$RUNNER_TEMP/qualified-provider" --tofu "$RUNNER_TEMP/worker-tools/tofu" --local-provider-archive "$RUNNER_TEMP/worker-tools/local.zip"
          uv run --frozen python scripts/worker_profile.py --shared-source .shared-cloudflare tls --provider-dir "$RUNNER_TEMP/qualified-provider" --tofu "$RUNNER_TEMP/worker-tools/tofu" --local-provider-archive "$RUNNER_TEMP/worker-tools/local.zip"
      - name: Retain successful qualified provider for explicit operator use
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: epg-qualified-worker-provider-linux-amd64
          path: ${{ runner.temp }}/qualified-provider/
          if-no-files-found: error
          retention-days: 30
      - name: Retain build diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worker-profile-diagnostics
          path: |
            ${{ runner.temp }}/qualified-provider/*.log
            ${{ runner.temp }}/qualified-provider/provenance.json
          if-no-files-found: warn
          retention-days: 30

  # Keep the existing check name while requiring each public build/test suite.
  python:
    needs: [python_checks, node_checks, container, worker_profile]
    if: >-
      always() && (github.event.repository.private != true ||
       github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    # Private installations retain their trusted runner. Public PRs use hosted VMs.
    runs-on: ${{ fromJSON(github.event.repository.private == true && '["self-hosted","Linux","X64","epg-voice-gateway"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Verify required checks
        env:
          PYTHON_RESULT: ${{ needs.python_checks.result }}
          NODE_RESULT: ${{ needs.node_checks.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
          WORKER_RESULT: ${{ needs.worker_profile.result }}
          PUBLIC_REPOSITORY: ${{ github.event.repository.private != true }}
        run: |
          if [[ "$PYTHON_RESULT" != success || "$NODE_RESULT" != success || ( "$PUBLIC_REPOSITORY" == true && ( "$CONTAINER_RESULT" != success || "$WORKER_RESULT" != success ) ) ]]; then
            printf 'Required checks did not succeed: Python=%s Node=%s Container=%s Worker=%s\n' "$PYTHON_RESULT" "$NODE_RESULT" "$CONTAINER_RESULT" "$WORKER_RESULT" >&2
            exit 1
          fi
