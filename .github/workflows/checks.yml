name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    if: >-
      github.event.repository.private == true &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64, epg-voice-gateway]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.12.7'
          python-version: '3.12'
          enable-cache: false
          cache-local-path: ${{ runner.temp }}/epg-voice-uv-cache
      - run: uv sync --frozen --extra test
      - run: uv run --frozen ruff check .
      - run: uv run --frozen pytest -q
      - name: Verify runtime lock matches uv.lock
        run: |
          uv export --frozen --no-dev --no-emit-project -o requirements.lock >/dev/null
          git diff --exit-code -- requirements.lock
      - name: Clean local dependency cache
        if: ${{ always() }}
        run: rm -rf -- "$RUNNER_TEMP/epg-voice-uv-cache"
