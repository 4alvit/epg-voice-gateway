name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python_checks:
    if: >-
      (github.event.repository.private != true ||
       github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    # Private installations retain their trusted runner. Public PRs use hosted VMs.
    runs-on: ${{ fromJSON(github.event.repository.private == true && '["self-hosted","Linux","X64","epg-voice-gateway"]' || '["ubuntu-latest"]') }}
    # Bounded private runners need time for cold dependencies and checkout cleanup.
    timeout-minutes: ${{ github.event.repository.private == true && 30 || 20 }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.12.7'
          python-version: '3.12'
          enable-cache: false
          cache-local-path: ${{ runner.temp }}/epg-voice-uv-cache
      - run: uv sync --frozen --extra test
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff check src integrations --select S
      - run: uv run --frozen pytest -q
      - name: Verify runtime lock matches uv.lock
        run: |
          uv export --frozen --no-dev --no-emit-project -o requirements.lock >/dev/null
          git diff --exit-code -- requirements.lock
      - name: Clean local dependency cache
        if: ${{ always() }}
        run: rm -rf -- "$RUNNER_TEMP/epg-voice-uv-cache"
  node_checks:
    if: >-
      (github.event.repository.private != true ||
       github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    # Private installations retain their trusted runner. Public PRs use hosted VMs.
    runs-on: ${{ fromJSON(github.event.repository.private == true && '["self-hosted","Linux","X64","epg-voice-gateway"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: node --test deploy/google-home-worker-vpc/relay.test.mjs
      - run: node --test deploy/alexa-worker-vpc/relay.test.mjs
  # Keep the existing check name while requiring both independent suites.
  python:
    needs: [python_checks, node_checks]
    if: >-
      always() && (github.event.repository.private != true ||
       github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    # Private installations retain their trusted runner. Public PRs use hosted VMs.
    runs-on: ${{ fromJSON(github.event.repository.private == true && '["self-hosted","Linux","X64","epg-voice-gateway"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Verify required checks
        env:
          PYTHON_RESULT: ${{ needs.python_checks.result }}
          NODE_RESULT: ${{ needs.node_checks.result }}
        run: |
          if [[ "$PYTHON_RESULT" != success || "$NODE_RESULT" != success ]]; then
            printf 'Required checks did not succeed: Python=%s Node=%s\n' "$PYTHON_RESULT" "$NODE_RESULT" >&2
            exit 1
          fi
