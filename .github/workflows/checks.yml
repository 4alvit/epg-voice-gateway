name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python_checks:
    if: >-
      (github.event.repository.private != true ||
       github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    # Private installations retain their trusted runner. Public PRs use hosted VMs.
    runs-on: ${{ fromJSON(github.event.repository.private == true && '["self-hosted","Linux","X64","epg-voice-gateway"]' || '["ubuntu-latest"]') }}
    # Bounded private runners need time for cold dependencies and checkout cleanup.
    timeout-minutes: ${{ github.event.repository.private == true && 30 || 20 }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.12.7'
          python-version: '3.12'
          enable-cache: false
          cache-local-path: ${{ runner.temp }}/epg-voice-uv-cache
      - run: uv sync --frozen --extra test
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff check src integrations --select S
      - run: uv run --frozen pytest -q
      - name: Verify runtime lock matches uv.lock
        run: |
          uv export --frozen --no-dev --no-emit-project -o requirements.lock >/dev/null
          git diff --exit-code -- requirements.lock
      - name: Clean local dependency cache
        if: ${{ always() }}
        run: rm -rf -- "$RUNNER_TEMP/epg-voice-uv-cache"
  node_checks:
    if: >-
      (github.event.repository.private != true ||
       github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    # Private installations retain their trusted runner. Public PRs use hosted VMs.
    runs-on: ${{ fromJSON(github.event.repository.private == true && '["self-hosted","Linux","X64","epg-voice-gateway"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: node --test deploy/google-home-worker-vpc/relay.test.mjs
      - run: node --test deploy/alexa-worker-vpc/relay.test.mjs
  container:
    if: github.event.repository.private != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the actual installed image
        run: docker build --progress=plain --tag epg-voice-gateway:ci .
      - name: Verify installed startup and authentication without network access
        run: docker run --rm --network none --interactive --entrypoint python epg-voice-gateway:ci - < container/smoke.py
      - name: Scan the actual image and retain its complete package inventory
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: epg-voice-gateway:ci
          format: json
          output: container-trivy.json
          scanners: vuln
          list-all-pkgs: true
          ignore-unfixed: false
          exit-code: '0'
      - name: Verify the native library fix and export the SBOM
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("container-trivy.json").read_text())
          packages = [package for result in report["Results"] for package in result.get("Packages", [])]
          matches = [package for package in packages if package["Name"] == "liblzma5"]
          assert len(matches) == 1, "The scanner must identify the installed liblzma5"
          assert matches[0]["Version"] == "5.8.1"
          assert matches[0]["Release"] == "1+deb13u2"
          findings = {finding["VulnerabilityID"] for result in report["Results"] for finding in result.get("Vulnerabilities", [])}
          assert not findings.intersection({"DSA-6549-1", "TEMP-1147318-639065", "GHSA-5qpq-xqfv-j9pg"})
          print("Verified the exact patched liblzma5 package and absence of the XZ advisory; all other findings remain in the report.")
          PY
          trivy convert --format cyclonedx --output container-sbom.cdx.json container-trivy.json
      - name: Upload image inventory and vulnerability evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-security-evidence
          path: |
            container-trivy.json
            container-sbom.cdx.json
          if-no-files-found: error
          retention-days: 14

  # Keep the existing check name while requiring each public build/test suite.
  python:
    needs: [python_checks, node_checks, container]
    if: >-
      always() && (github.event.repository.private != true ||
       github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    # Private installations retain their trusted runner. Public PRs use hosted VMs.
    runs-on: ${{ fromJSON(github.event.repository.private == true && '["self-hosted","Linux","X64","epg-voice-gateway"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Verify required checks
        env:
          PYTHON_RESULT: ${{ needs.python_checks.result }}
          NODE_RESULT: ${{ needs.node_checks.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
          PUBLIC_REPOSITORY: ${{ github.event.repository.private != true }}
        run: |
          if [[ "$PYTHON_RESULT" != success || "$NODE_RESULT" != success || ( "$PUBLIC_REPOSITORY" == true && "$CONTAINER_RESULT" != success ) ]]; then
            printf 'Required checks did not succeed: Python=%s Node=%s Container=%s\n' "$PYTHON_RESULT" "$NODE_RESULT" "$CONTAINER_RESULT" >&2
            exit 1
          fi
