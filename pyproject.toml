[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "epg-voice-gateway"
version = "0.1.0b2"
description = "Find currently airing programmes and play them through an existing HLS proxy"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "anyio>=4,<5",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.8,<3",
  "defusedxml>=0.7.1,<1",
  "ask-sdk-webservice-support==1.3.3",
  "cryptography>=50.0.2,<51",
  # Includes the upstream OpenSSL version parsing fix missing from PyPI 1.3.0.
  "oscrypto @ https://github.com/wbond/oscrypto/archive/d5f3437ed24257895ae1edd9e503cfb352e635a8.tar.gz",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.11,<1",
  "pyyaml>=6,<7",
  "jinja2>=3.1,<4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/epg_voice_gateway"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
